name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of an existing v* tag to publish (e.g. 1.8.0)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nuget.org trusted publishing: the job trades GitHub's OIDC token for a one-hour API key,
      # so no long-lived key is stored. The policy on nuget.org names this repository and file.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run republishes a release, so it builds that release's tag, not the branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both are required: the solution multi-targets net9.0;net10.0.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore MokaDocs.slnx

      - name: Build
        run: dotnet build MokaDocs.slnx --no-restore -c Release

      - name: Test
        run: dotnet test MokaDocs.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack MokaDocs.slnx --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkgs

      - name: Check the NuGet user
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER repository secret to the nuget.org profile name that owns the packages."
            exit 1
          fi

      # Right before the push: the key it returns is valid for one hour.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
