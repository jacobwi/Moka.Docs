name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the docs site dates each page from its last commit, and a shallow
          # clone gives every page the date of the latest commit.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both are required: the solution multi-targets net9.0;net10.0.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore MokaDocs.slnx

      - name: Build
        run: dotnet build MokaDocs.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        # No --report-trx-filename: a fixed name made all five test projects write the same
        # file, so the uploaded artifact held only whichever finished last. The default name
        # is unique per project and target framework.
        run: dotnet test MokaDocs.slnx --no-build --configuration Release --report-trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: 'TestResults/*.trx'

      - name: Build documentation site
        run: dotnet run --project src/Moka.Docs.Cli --configuration Release --framework net9.0 -- build --output ./docs/_site --base-path /Moka.Docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site/
          # v4 and later leave dotfiles out by default, and the site ships .nojekyll.
          include-hidden-files: true

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
