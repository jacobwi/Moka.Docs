site:
  title: "MyLib Python"
  description: "Sample Python library documented by the mokadocs-python-api plugin"
  copyright: "(c) 2026 MokaDocs Samples"

content:
  docs: ./docs

theme:
  name: default
  options:
    primaryColor: "#3776ab"
    accentColor: "#ffd43b"

nav:
  - label: "API Reference"
    path: /api
    icon: code
    expanded: true

plugins:
  - name: mokadocs-python-api
    options:
      source: ./mylib
      label: "API Reference"
      routePrefix: /api
      docstringFormat: google

build:
  output: ./_site
